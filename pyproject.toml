[project]
name = "rnpydev"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
 "basern",
 "click>=8.5.1",
 "faker==37.12.0",
 "filetype==1.2.0",
 "gputil==1.4.0",
 "iniconfig==2.1.0",
 "markdown-it-py==4.2.0",
 "multipledispatch>=1.0.0",
 "numpy>=2.5.4",
 "opencv-python>=5.0.0.93",
 "packaging==25.0",
 "pandas==2.3.3",
 "pillow>=12.3.0",
 "pillow-heif>=1.3.0",
 "psutil==7.2.2",
 "pyinputplus==0.2.12",
 "pypdf==6.16.1",
 "pyperclip>=1.11.0",
 "pytest>=9.0.3",
 "pytz>=2025.2",
 "requests>=2.33.0",
 "scikit-image>=0.26.0",
 "scipy>=1.16.2",
 "setuptools>=83.0.0",
 "tabulate>=0.9.0",
 "tifffile>=2025.9.20",
 "typer>=0.25.1",
 "types-pytz==2025.2.0.20251108",
 "tzdata>=2025.2",
]

[tool.uv.workspace]
members = [
    "basern",
]

[tool.uv.sources]
basern = { workspace = true }

# hatchling stuff added RN
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basern"]  # Tell uv to make this folder importable

