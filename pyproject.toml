[project]
name = "rnpydev"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
 "basern",
 "opencv-python>=5.0.0.93",
 "pillow>=12.3.0",
 "pillow-heif>=1.8.0",
 "psutil>=7.2.2",
 "pyperclip>=1.11.0",
 "typer>=0.27.2",
]

[tool.uv.workspace]
members = [
    "basern",
]

[tool.uv.sources]
basern = { workspace = true }

# hatchling stuff added RN
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["basern"]  # Tell uv to make this folder importable

