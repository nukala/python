[project]
name = "rnpydev"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
 "basern",
]

[tool.uv.workspace]
members = [
    "basern",
]

[tool.uv.sources]
basern = { workspace = true }

# hatchling stuff added RN
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basern"]  # Tell uv to make this folder importable

