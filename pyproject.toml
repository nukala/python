[project]
name = "rnpydev"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
 "annotated-doc==0.0.4",
 "basern",
 "certifi==2025.11.12",
 "charset-normalizer==3.4.4",
 "click==8.3.3",
 "colorama==0.4.6",
 "faker==37.12.0",
 "filetype==1.2.0",
 "gputil==1.4.0",
 "idna==3.15",
 "imageio>=2.38.1",
 "iniconfig==2.1.0",
 "jinja2==3.1.6",
 "lazy-loader==0.4",
 "markdown-it-py==4.2.0",
 "markupsafe==3.0.3",
 "mdurl==0.1.2",
 "networkx==3.5",
 "numpy>=2.5.4",
 "opencv-python>=5.0.0.93",
 "packaging==25.0",
 "pandas==2.3.3",
 "pillow==12.3.0",
 "pillow-heif==1.3.0",
 "pluggy==1.6.0",
 "psutil==7.2.2",
 "pygments==2.20.0",
 "pyinputplus==0.2.12",
 "pypdf==6.16.1",
 "pyperclip>=1.11.0",
 "pysimplevalidate==0.2.12",
 "pytest==9.0.3",
 "python-dateutil==2.9.0.post0",
 "pytz==2025.2",
 "requests==2.33.0",
 "rich==15.0.0",
 "scikit-image>=0.26.0",
 "scipy==1.16.2",
 "setuptools==83.0.0",
 "shellingham==1.5.4",
 "six==1.17.0",
 "stdiomask==0.0.6",
 "tabulate==0.9.0",
 "tifffile==2025.9.20",
 "tqdm==4.67.1",
 "typer==0.25.1",
 "types-pytz==2025.2.0.20251108",
 "tzdata==2025.2",
 "urllib3==2.8.0",
]

[tool.uv.workspace]
members = [
    "basern",
]

[tool.uv.sources]
basern = { workspace = true }

# hatchling stuff added RN
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basern"]  # Tell uv to make this folder importable

